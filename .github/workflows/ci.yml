name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind run to the exact event head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install trusted Linux sandbox
        run: |
          sudo apt-get update && sudo apt-get install --yes bubblewrap ripgrep
          # ubuntu-24.04 restricts unprivileged user namespaces via AppArmor;
          # the bwrap loopback probe (RTM_NEWADDR) needs this relaxed.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Pin npm
        run: npm install --global npm@11.13.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run validate
        env:
          # Pin the cmux memory contract so budget-derived expectations are
          # deterministic (runners lack the 16 GiB reserve + 3 GiB/worker the
          # local budget path assumes).
          CMUX_MEMORY_PLAN_VERSION: "1"
          CMUX_AGENT_OLD_SPACE_MIB: "1536"
          CMUX_SWARM_MAX_CONCURRENCY: "4"
          CMUX_MEMORY_AVAILABLE_MIB: "49152"
      - name: Debug bwrap child spawn (temporary)
        run: |
          set -x
          SCRATCH=$(mktemp -d /tmp/pi-ig-dbg-XXXXXX); mkdir -p $SCRATCH/allowed $SCRATCH/cache
          echo "=== replica: exact probe args (dev/null as --bind)"
          bwrap --die-with-parent --unshare-all --cap-drop ALL --tmpfs / --tmpfs /tmp \
            --dir /usr --dir /etc --dir /opt --dir /tmp --dir /etc/ssl --dir $SCRATCH \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 --symlink usr/bin /bin --symlink usr/sbin /sbin \
            --ro-bind /usr /usr --ro-bind /etc/ld.so.cache /etc/ld.so.cache \
            --ro-bind /opt/hostedtoolcache/node/24.16.0/x64 /opt/hostedtoolcache/node/24.16.0/x64 \
            --bind $SCRATCH/allowed $SCRATCH/allowed --bind $SCRATCH/cache $SCRATCH/cache \
            --dir /dev --bind /dev/null /dev/null --bind /dev/zero /dev/zero \
            --ro-bind /dev/random /dev/random --ro-bind /dev/urandom /dev/urandom \
            --proc /proc --clearenv --setenv HOME $SCRATCH/allowed --setenv TMPDIR $SCRATCH/allowed --setenv PATH /usr/bin:/bin \
            --chdir $SCRATCH/allowed /opt/hostedtoolcache/node/24.16.0/x64/bin/node -e "const fs=require('node:fs'),{spawn}=require('node:child_process');const c=spawn(process.execPath,['-e','setTimeout(()=>{},100)'],{stdio:'ignore'});c.on('error',e=>console.log('CHILD ERR',e.code));c.on('spawn',()=>console.log('CHILD OK'));" || true
          echo "=== variant: /dev/null + /dev/zero via --dev-bind"
          bwrap --die-with-parent --unshare-all --cap-drop ALL --tmpfs / --tmpfs /tmp \
            --dir /usr --dir /etc --dir /opt --dir /tmp --dir /etc/ssl --dir $SCRATCH \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 --symlink usr/bin /bin --symlink usr/sbin /sbin \
            --ro-bind /usr /usr --ro-bind /etc/ld.so.cache /etc/ld.so.cache \
            --ro-bind /opt/hostedtoolcache/node/24.16.0/x64 /opt/hostedtoolcache/node/24.16.0/x64 \
            --bind $SCRATCH/allowed $SCRATCH/allowed --bind $SCRATCH/cache $SCRATCH/cache \
            --dir /dev --dev-bind /dev/null /dev/null --dev-bind /dev/zero /dev/zero \
            --ro-bind /dev/random /dev/random --ro-bind /dev/urandom /dev/urandom \
            --proc /proc --clearenv --setenv HOME $SCRATCH/allowed --setenv TMPDIR $SCRATCH/allowed --setenv PATH /usr/bin:/bin \
            --chdir $SCRATCH/allowed /opt/hostedtoolcache/node/24.16.0/x64/bin/node -e "const fs=require('node:fs'),{spawn}=require('node:child_process');const c=spawn(process.execPath,['-e','setTimeout(()=>{},100)'],{stdio:'ignore'});c.on('error',e=>console.log('CHILD ERR',e.code));c.on('spawn',()=>console.log('CHILD OK'));" || true
      - name: Require real Linux trusted-sandbox execution
        run: npm run test:trusted-security -- --require-backend
      - name: Certify the exact event head with the committed policy
        run: npm run trusted:head -- --output "$RUNNER_TEMP/trusted-head-proof.json"
      - name: Prove provider preflight is offline by default
        run: node scripts/model-roster-probe.mjs --output "$RUNNER_TEMP/model-roster-offline.json"
      - name: Preserve exact-head validation receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-head-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/trusted-head-proof.json
            ${{ runner.temp }}/model-roster-offline.json
          if-no-files-found: error
          retention-days: 14

  trusted-macos:
    name: trusted verification (macOS Seatbelt)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind run to the exact event head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.13.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Require real macOS Seatbelt execution
        run: npm run test:trusted-security -- --require-backend
